# /start is always answered in English — a first-contact user has no language preference yet.
command.start=👋 Welcome to Backlog.fyi — your weekly planning assistant.\n\nTo get started, set up your account at backlog.fyi and connect Telegram from settings. Then I’ll help you plan your week and capture tasks right here.\n\nAlready connected? Send /help to see what I can do.
# Sent once, when a user connects Telegram for the first time — localized to the (established) user.
command.link.welcome=🎉 Telegram is connected! I’m your Backlog.fyi planning assistant. I’ll reach out here for your weekly planning, and you can send /add anytime to capture a task. Send /help to see everything I can do.

