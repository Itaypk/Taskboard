server:
  servlet:
    session:
      cookie:
        secure: true

spring:
  datasource:
    url: ${TASKER_DB_URL}
    username: ${TASKER_DB_USERNAME}
    password: ${TASKER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

tasker:
  telegram:
    enabled: true
    bot-token: ${TASKER_TELEGRAM_BOT_TOKEN:?TASKER_TELEGRAM_BOT_TOKEN is required in prod}
  prometheus:
    username: ${TASKER_PROMETHEUS_USERNAME:?TASKER_PROMETHEUS_USERNAME is required in prod}
    password: ${TASKER_PROMETHEUS_PASSWORD:?TASKER_PROMETHEUS_PASSWORD is required in prod}
