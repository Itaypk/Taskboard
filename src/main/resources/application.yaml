spring:
  application:
    name: taskboard
  messages:
    basename: messages
    encoding: UTF-8
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  session:
    store-type: jdbc
    timeout: 30d
    jdbc:
      initialize-schema: never

server:
  shutdown: graceful
  http2:
    enabled: true
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        max-age: 2592000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

tasker:
  app:
    base-url: ${TASKER_APP_BASE_URL:https://backlog.fyi}
  ai:
    api-key: ${TASKER_AI_API_KEY:}
    base-url: ${TASKER_AI_BASE_URL:https://openrouter.ai/api/v1}
    weekly-planning-model: ${TASKER_AI_PLANNING_MODEL:openai/gpt-oss-20b:free}
  telegram:
    bot-token: ${TASKER_TELEGRAM_BOT_TOKEN:}
    bot-username: ${TASKER_TELEGRAM_BOT_USERNAME:}
  prometheus:
    username: ${TASKER_PROMETHEUS_USERNAME:prometheus}
    password: ${TASKER_PROMETHEUS_PASSWORD:prometheus-dev}
  rate-limit:
    api:
      limit: 300
      window-seconds: 60
    demo-login:
      limit: 5
      window-seconds: 3600
  email:
    enabled: ${TASKER_EMAIL_ENABLED:false}
    from: ${TASKER_EMAIL_FROM:}
    from-name: ${TASKER_EMAIL_FROM_NAME:Tasker}
    smtp:
      host: ${TASKER_EMAIL_SMTP_HOST:smtp.protonmail.ch}
      port: ${TASKER_EMAIL_SMTP_PORT:587}
      username: ${TASKER_EMAIL_SMTP_USERNAME:}
      password: ${TASKER_EMAIL_SMTP_PASSWORD:}
