spring:
  profiles:
    active: dev
  application:
    name: taskboard
  datasource:
    url: jdbc:h2:mem:taskboard;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

server:
  servlet:
    session:
      timeout: 14d
      cookie:
        http-only: true
        same-site: lax
        max-age: 1209600

tasker:
  telegram:
    bot-token: ${TASKER_TELEGRAM_BOT_TOKEN:}
    bot-username: ${TASKER_TELEGRAM_BOT_USERNAME:}
