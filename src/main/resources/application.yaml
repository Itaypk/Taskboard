spring:
  application:
    name: taskboard
  messages:
    basename: messages
    encoding: UTF-8
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  session:
    store-type: jdbc
    timeout: 30d
    jdbc:
      initialize-schema: never
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful
  http2:
    enabled: true
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        max-age: 2592000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

tasker:
  app:
    base-url: ${TASKER_APP_BASE_URL:https://backlog.fyi}
  ai:
    api-key: ${TASKER_AI_API_KEY:}
    base-url: ${TASKER_AI_BASE_URL:https://openrouter.ai/api/v1}
    weekly-planning-model: ${TASKER_AI_PLANNING_MODEL:openai/gpt-oss-20b:free}
    # Model for the planner's task search/suggestion sub-agents; defaults to the planning model.
    task-assistant-model: ${TASKER_AI_TASK_ASSISTANT_MODEL:${TASKER_AI_PLANNING_MODEL:openai/gpt-oss-20b:free}}
    # Model for quick-add captures carrying an image or a voice note; defaults to the task-assistant
    # model. Must advertise the matching input modality (image / audio) in OpenRouter's model
    # capabilities, or media capture is declined with a "describe it in text" reply.
    multimodal-model: ${TASKER_AI_MULTIMODAL_MODEL:}
    # Reasoning/effort level per functionality. Value: minimal|low|medium|high, or blank (default)
    # for no reasoning override. Only sent to models whose capabilities (fetched at startup) report
    # reasoning support, so a level set here on a non-reasoning model is silently skipped.
    reasoning:
      weekly-planning: ${TASKER_AI_REASONING_WEEKLY_PLANNING:low}
      task-search: ${TASKER_AI_REASONING_TASK_SEARCH:low}
      task-suggestion: ${TASKER_AI_REASONING_TASK_SUGGESTION:medium}
      slot-reminder: ${TASKER_AI_REASONING_SLOT_REMINDER:low}
  telegram:
    bot-token: ${TASKER_TELEGRAM_BOT_TOKEN:}
    bot-username: ${TASKER_TELEGRAM_BOT_USERNAME:}
    enabled: ${TASKER_TELEGRAM_ENABLED:false}
    # OIDC login (BotFather → Bot Settings → Web Login). Required for Telegram login in prod.
    client-id: ${TASKER_TELEGRAM_CLIENT_ID:}
    client-secret: ${TASKER_TELEGRAM_CLIENT_SECRET:}
  prometheus:
    username: ${TASKER_PROMETHEUS_USERNAME:prometheus}
    password: ${TASKER_PROMETHEUS_PASSWORD:prometheus-dev}
  encryption:
    # Base64-encoded 32-byte (256-bit) key. In dev/test we fall back to a fixed,
    # checked-in key so the app boots without configuration. Prod MUST set
    # TASKER_DATA_KEK — never reuse the dev key for any data that matters.
    kek: ${TASKER_DATA_KEK:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
  session:
    # Absolute cap on a session's life, no matter how active it is — the counterweight to the
    # sliding 30-day idle timeout above, which on its own never expires a session an attacker
    # keeps warm. Re-stamped on each login, so this is "a year since last sign-in". Users can
    # see and revoke their own sessions from Settings.
    max-lifetime: ${TASKER_SESSION_MAX_LIFETIME:365d}
  rate-limit:
    api:
      limit: 300
      window-seconds: 60
    demo-login:
      limit: 5
      window-seconds: 3600
    feedback:
      limit: 10
      window-seconds: 3600
    # Captures opened per user per hour. Free text sent to the bot is a capture, so /add no longer
    # throttles the model calls; this bounds a runaway forwarding loop.
    quick-add:
      limit: 60
      window-seconds: 3600
    # Agent API (/api/external/v1) gets its own per-user budget, separate from the SPA's.
    external-api:
      limit: 120
      window-seconds: 60
  feedback:
    # Mailbox that in-app feedback is forwarded to (via the auth email sender). When blank,
    # falls back to the auth sender's own `from` address.
    recipient: ${TASKER_FEEDBACK_RECIPIENT:}
  email:
    enabled: ${TASKER_EMAIL_ENABLED:false}
    # Comma-separated domains refused for any new address (login, settings, board invites).
    # Prefix an entry with `*.` to match subdomains only, not the domain itself — e.g.
    # `*.mailinator.com` blocks `inbox.mailinator.com` but not `mailinator.com`; list both
    # forms to block a domain and all its subdomains.
    blocked-domains: ${TASKER_EMAIL_BLOCKED_DOMAINS:}
    # Critical path: login / register / verification magic links.
    auth:
      from: ${TASKER_EMAIL_AUTH_FROM:}
      from-name: ${TASKER_EMAIL_AUTH_FROM_NAME:Backlog.fyi}
      smtp:
        host: ${TASKER_EMAIL_AUTH_SMTP_HOST:smtp.protonmail.ch}
        port: ${TASKER_EMAIL_AUTH_SMTP_PORT:587}
        username: ${TASKER_EMAIL_AUTH_SMTP_USERNAME:}
        password: ${TASKER_EMAIL_AUTH_SMTP_PASSWORD:}
    # Scheduling: calendar invitations for planned time blocks.
    scheduling:
      from: ${TASKER_EMAIL_SCHEDULING_FROM:}
      from-name: ${TASKER_EMAIL_SCHEDULING_FROM_NAME:Backlog.fyi}
      smtp:
        host: ${TASKER_EMAIL_SCHEDULING_SMTP_HOST:smtp.protonmail.ch}
        port: ${TASKER_EMAIL_SCHEDULING_SMTP_PORT:587}
        username: ${TASKER_EMAIL_SCHEDULING_SMTP_USERNAME:}
        password: ${TASKER_EMAIL_SCHEDULING_SMTP_PASSWORD:}
