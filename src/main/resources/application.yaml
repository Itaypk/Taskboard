spring:
  application:
    name: taskboard
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  session:
    store-type: jdbc
    timeout: 30d
    jdbc:
      initialize-schema: never

server:
  shutdown: graceful
  http2:
    enabled: true
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        max-age: 2592000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

tasker:
  ai:
    api-key: ${TASKER_AI_API_KEY:}
    base-url: ${TASKER_AI_BASE_URL:https://openrouter.ai/api/v1}
  telegram:
    bot-token: ${TASKER_TELEGRAM_BOT_TOKEN:}
    bot-username: ${TASKER_TELEGRAM_BOT_USERNAME:}
  prometheus:
    username: ${TASKER_PROMETHEUS_USERNAME:prometheus}
    password: ${TASKER_PROMETHEUS_PASSWORD:prometheus-dev}
  rate-limit:
    api:
      limit: 300
      window-seconds: 60
    demo-login:
      limit: 5
      window-seconds: 3600
