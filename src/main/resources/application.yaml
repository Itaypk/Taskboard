spring:
  application:
    name: taskboard
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Every task read maps `category` (@ManyToOne LAZY) and `tags` (@ManyToMany LAZY), so a board
        # of N tasks used to issue ~1 + N selects for the tag collections alone. Batch fetching
        # collapses those per-row lookups into `IN (...)` batches, making a board list a constant
        # ~3 queries regardless of size. Global rather than a per-query @EntityGraph because the same
        # two associations are walked from the board list, the planner's cross-board reads, /sync and
        # the external API — one setting covers every path instead of a fetch hint on each.
        default_batch_fetch_size: 100
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  session:
    store-type: jdbc
    timeout: 30d
    jdbc:
      initialize-schema: never
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful
  http2:
    enabled: true
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        max-age: 2592000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

tasker:
  app:
    base-url: ${TASKER_APP_BASE_URL:https://backlog.fyi}
    # Product name and public contact addresses, shown in emails, Telegram and the web UI.
    # (Message bundles are read by BrandedMessageSource, which substitutes the name and base URL.)
    name: ${TASKER_APP_NAME:Backlog.fyi}
    support-email: ${TASKER_SUPPORT_EMAIL:hello@backlog.fyi}
    abuse-email: ${TASKER_ABUSE_EMAIL:abuse@backlog.fyi}
    # Hard cap on simultaneously unclaimed accounts — a surge safety valve, separate from the
    # inactivity-based cleanup sweep. Deliberately generous.
    unclaimed-account-cap: ${TASKER_UNCLAIMED_ACCOUNT_CAP:1000}
  ai:
    api-key: ${TASKER_AI_API_KEY:}
    base-url: ${TASKER_AI_BASE_URL:https://openrouter.ai/api/v1}
    # Default for every AI feature (the hosted instance runs it for all of them): capable, strong
    # multilingual support (the app speaks en/he/ru/ar), multimodal input for photo and voice-note
    # captures, zero-data-retention endpoints (see zero-data-retention below), and very budget-friendly.
    weekly-planning-model: ${TASKER_AI_PLANNING_MODEL:google/gemini-3.5-flash-lite}
    # Model for the planner's task search/suggestion sub-agents; defaults to the planning model.
    task-assistant-model: ${TASKER_AI_TASK_ASSISTANT_MODEL:${TASKER_AI_PLANNING_MODEL:google/gemini-3.5-flash-lite}}
    # Model for quick-add captures carrying an image or a voice note; defaults to the task-assistant
    # model. Must advertise the matching input modality (image / audio) in OpenRouter's model
    # capabilities, or media capture is declined with a "describe it in text" reply.
    multimodal-model: ${TASKER_AI_MULTIMODAL_MODEL:}
    # Send every call only to provider endpoints that retain no prompt data (OpenRouter `provider.zdr`).
    # Every configured model needs a ZDR endpoint (https://openrouter.ai/api/v1/endpoints/zdr), or its
    # calls fail; ZeroDataRetentionCheck warns about that at startup.
    zero-data-retention: ${TASKER_AI_ZERO_DATA_RETENTION:true}
    # Reasoning/effort level per functionality. Value: minimal|low|medium|high, or blank (default)
    # for no reasoning override. Only sent to models whose capabilities (fetched at startup) report
    # reasoning support, so a level set here on a non-reasoning model is silently skipped.
    reasoning:
      weekly-planning: ${TASKER_AI_REASONING_WEEKLY_PLANNING:low}
      task-search: ${TASKER_AI_REASONING_TASK_SEARCH:low}
      task-suggestion: ${TASKER_AI_REASONING_TASK_SUGGESTION:medium}
      slot-reminder: ${TASKER_AI_REASONING_SLOT_REMINDER:low}
    # Hard cap on accounts holding a granted AI tier at once (budget safety valve for the prepaid
    # OpenRouter key). New registrations past the cap start ungranted; see AiTierCapProperties.
    tier-cap:
      max-granted-users: ${TASKER_AI_TIER_CAP_MAX_GRANTED_USERS:50}
  telegram:
    bot-token: ${TASKER_TELEGRAM_BOT_TOKEN:}
    bot-username: ${TASKER_TELEGRAM_BOT_USERNAME:}
    enabled: ${TASKER_TELEGRAM_ENABLED:false}
    # OIDC login (BotFather → Bot Settings → Web Login). Required for Telegram login in prod.
    client-id: ${TASKER_TELEGRAM_CLIENT_ID:}
    client-secret: ${TASKER_TELEGRAM_CLIENT_SECRET:}
  auth:
    # open: anyone may create an account. closed: only existing accounts and the local users below.
    registration: ${TASKER_REGISTRATION:open}
    # The zero-registration sandbox; only offered while registration is open.
    demo-enabled: ${TASKER_DEMO_ENABLED:true}
    # Username/password logins, `username:bcrypt-hash` (see `htpasswd -nbB`). Inline and comma-separated,
    # and/or a file with one entry per line.
    local:
      users: ${TASKER_LOCAL_USERS:}
      users-file: ${TASKER_LOCAL_USERS_FILE:}
  prometheus:
    username: ${TASKER_PROMETHEUS_USERNAME:prometheus}
    password: ${TASKER_PROMETHEUS_PASSWORD:prometheus-dev}
  encryption:
    # Base64-encoded 32-byte (256-bit) key. In dev/test we fall back to a fixed,
    # checked-in key so the app boots without configuration. Prod MUST set
    # TASKER_DATA_KEK — never reuse the dev key for any data that matters.
    kek: ${TASKER_DATA_KEK:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
  session:
    # Absolute cap on a session's life, no matter how active it is — the counterweight to the
    # sliding 30-day idle timeout above, which on its own never expires a session an attacker
    # keeps warm. Re-stamped on each login, so this is "a year since last sign-in". Users can
    # see and revoke their own sessions from Settings.
    max-lifetime: ${TASKER_SESSION_MAX_LIFETIME:365d}
  rate-limit:
    api:
      limit: 300
      window-seconds: 60
    # Keyed per client IP, and ClientIp resolves to the NAT's address — so this is really
    # "per office/carrier gateway", not per person. The sandbox is the landing page's primary
    # call-to-action, so a launch-day crowd behind one CGNAT must not hit the wall.
    demo-login:
      limit: 20
      window-seconds: 3600
    # Magic-link sends per client IP. Complements the per-address cap in EmailLoginService: that
    # one stops repeat mail to one victim, this one stops mail to many.
    email-login:
      limit: 10
      window-seconds: 3600
    # Verification sends per user. Pinned here rather than left on the code default so the whole
    # rate-limit surface is visible in one place.
    email-verification:
      limit: 5
      window-seconds: 3600
    telegram-login:
      limit: 30
      window-seconds: 60
    feedback:
      limit: 10
      window-seconds: 3600
    # Captures opened per user per hour. Free text sent to the bot is a capture, so /add no longer
    # throttles the model calls; this bounds a runaway forwarding loop.
    quick-add:
      limit: 60
      window-seconds: 3600
    # Agent API (/api/external/v1) gets its own per-user budget, separate from the SPA's.
    external-api:
      limit: 120
      window-seconds: 60
    # Password attempts (local users), counted per client IP and, separately, per username.
    password-login:
      limit: 10
      window-seconds: 900
  feedback:
    # Mailbox that in-app feedback is forwarded to (via the auth email sender). When blank,
    # falls back to the auth sender's own `from` address.
    recipient: ${TASKER_FEEDBACK_RECIPIENT:}
  email:
    enabled: ${TASKER_EMAIL_ENABLED:false}
    # Extra domains refused for any new address (login, settings, board invites), comma-separated.
    # This is an *addition* to the ~75k-domain disposable-mail list bundled on the classpath
    # (src/main/resources/email/disposable-domains.txt.gz) — it cannot unblock a bundled domain.
    # Prefix an entry with `*.` to match subdomains only, not the domain itself — e.g.
    # `*.mailinator.com` blocks `inbox.mailinator.com` but not `mailinator.com`; list both
    # forms to block a domain and all its subdomains. The bundled list is exact-match only.
    blocked-domains: ${TASKER_EMAIL_BLOCKED_DOMAINS:}
    # Critical path: login / register / verification magic links.
    auth:
      from: ${TASKER_EMAIL_AUTH_FROM:}
      from-name: ${TASKER_EMAIL_AUTH_FROM_NAME:${TASKER_APP_NAME:Backlog.fyi}}
      smtp:
        host: ${TASKER_EMAIL_AUTH_SMTP_HOST:smtp.protonmail.ch}
        port: ${TASKER_EMAIL_AUTH_SMTP_PORT:587}
        username: ${TASKER_EMAIL_AUTH_SMTP_USERNAME:}
        password: ${TASKER_EMAIL_AUTH_SMTP_PASSWORD:}
    # Scheduling: calendar invitations for planned time blocks.
    scheduling:
      from: ${TASKER_EMAIL_SCHEDULING_FROM:}
      from-name: ${TASKER_EMAIL_SCHEDULING_FROM_NAME:${TASKER_APP_NAME:Backlog.fyi}}
      smtp:
        host: ${TASKER_EMAIL_SCHEDULING_SMTP_HOST:smtp.protonmail.ch}
        port: ${TASKER_EMAIL_SCHEDULING_SMTP_PORT:587}
        username: ${TASKER_EMAIL_SCHEDULING_SMTP_USERNAME:}
        password: ${TASKER_EMAIL_SCHEDULING_SMTP_PASSWORD:}
