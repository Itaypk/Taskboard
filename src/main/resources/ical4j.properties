# ical4j settings (read from the classpath by net.fortuna.ical4j.util.Configurator).
# Reading other people's calendars (GitHub issues #347, #413): tolerate the quirks real feeds have.
ical4j.unfolding.relaxed=true
ical4j.parsing.relaxed=true
ical4j.validation.relaxed=true
ical4j.compatibility.outlook=true
# Never fetch time-zone updates from the network (tzurl.org): parsing must make no outbound calls.
net.fortuna.ical4j.timezone.update.enabled=false
