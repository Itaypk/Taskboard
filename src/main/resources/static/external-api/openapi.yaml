openapi: 3.1.0
info:
  title: Backlog.fyi External API
  version: "1.0"
  description: |
    Task and weekly-plan API for anything outside the web app — scripts, automations, AI
    assistants — authenticated with a long-lived personal API token. Create one in the app under
    Settings -> Integrations.

    This is a narrower surface than the web app's own API: it covers task content and the weekly
    plan. It cannot reach account settings, the in-app planning conversation, board
    administration, or token management.

    Token scopes, each including the one before: `read` (GET only), `write` (task changes) and
    `plan` (plan changes, which send calendar invitations).

    All bodies are JSON. Errors are RFC 7807 `application/problem+json`; the `detail` field
    names what was wrong and, where relevant, the allowed values.
servers:
  - url: https://backlog.fyi
    description: Production
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: tasks
    description: Read and modify backlog tasks.
  - name: reference
    description: Boards, categories and tags — the values a write call may refer to.
  - name: plans
    description: |
      The weekly plan: which tasks get which time blocks. You do the planning; a submit replaces
      the week's plan and the app delivers it to the user's calendar.

paths:
  /api/external/v1/me:
    get:
      tags: [reference]
      summary: Identity and context for the calling token
      description: |
        Who this token acts as, plus the context needed to interpret dates. `timeZone` matters:
        `deadline` and `relevantFrom` are plain calendar dates, and the server hides future-dated
        tasks relative to the *user's* zone — so resolve "tomorrow" against this, not your own
        clock. Also the cheapest way to check that a token is valid and what it may do.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/external/v1/boards:
    get:
      tags: [reference]
      summary: List the caller's boards
      description: The first board is the default one that write calls target when none is named.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Board" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/external/v1/categories:
    get:
      tags: [reference]
      summary: List categories
      description: Every board's categories unless `board` narrows it. Each carries its `boardId`.
      parameters:
        - { name: board, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/external/v1/tags:
    get:
      tags: [reference]
      summary: List tags
      parameters:
        - { name: board, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tag" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/external/v1/tasks:
    get:
      tags: [tasks]
      summary: Search and list tasks
      description: |
        Spans every board the caller belongs to unless `board` narrows it. Tasks the user has
        hidden from the assistant are excluded unless `includeHidden=true`.
      parameters:
        - { name: board, in: query, schema: { type: string, format: uuid },
            description: Restrict to one board. }
        - { name: status, in: query, schema: { type: string, enum: [todo, done, archived, all], default: todo },
            description: "`all` means everything except archived." }
        - { name: q, in: query, schema: { type: string },
            description: Case-insensitive substring match on title and description. }
        - { name: tag, in: query, schema: { type: string },
            description: Exact tag label, case-insensitive. }
        - { name: priority, in: query, schema: { type: string, enum: [low, medium, high] } }
        - { name: includeHidden, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [tasks]
      summary: Create a task
      description: |
        Only `title` is required. `boardId` defaults to the caller's default board and
        `categoryId` to that board's first category, so `{"title": "..."}` is a valid call.
        Requires a write-scoped token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/external/v1/tasks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [tasks]
      summary: Fetch one task
      description: |
        Finds the task on whichever of the caller's boards it lives on. A task the user hid from
        the assistant answers 404 unless `includeHidden=true`.
      parameters:
        - { name: includeHidden, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tasks]
      summary: Partially update a task
      description: |
        Only the fields present in the body change; everything else is left alone. Unsetting a
        field is a separate, explicit operation — name it in `clear`. Requires a write-scoped
        token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/external/v1/tasks/{id}/complete:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [tasks]
      summary: Mark a task done
      description: |
        Idempotent — completing an already-done task succeeds and returns it unchanged.
        Prefer this over writing `status` yourself. Requires a write-scoped token.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/external/v1/tasks/{id}/archive:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [tasks]
      summary: Archive a task
      description: |
        The reversible delete — this API has no hard delete. Idempotent. Requires a
        write-scoped token.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/external/v1/plans/week/{week}:
    parameters:
      - name: week
        in: path
        required: true
        schema: { type: string }
        description: "`current`, `next`, or the week's first day as YYYY-MM-DD (it must fall on the user's week-start day)."
      - name: includeHidden
        in: query
        schema: { type: boolean, default: false }
        description: Show planned tasks the user hid from the assistant. Their count is in `plan.hiddenTasksOmitted` otherwise.
    get:
      tags: [plans]
      summary: Read a week's plan and events
      description: |
        The finalized plan for the week (null if the week was never planned), the week's one-off
        calendar events, and what you need to write a plan: the week's bounds, the user's time
        zone, and where plan changes are delivered (`calendarDelivery`). Any token may read.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeekPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [plans]
      summary: Replace a week's plan
      description: |
        Submits the whole plan for the week. A task left out comes off the plan and its calendar
        invitations are cancelled, with one exception: tasks the user hid from the assistant that
        are already planned stay as they are unless you list them. Changed slots are re-sent and
        new ones invited, the same way the app's own planner does it. An empty `tasks` list
        clears the plan.

        Only the current week or a later one can be planned. Done or archived tasks may stay in
        the plan unchanged but can't be added or moved. Requires a `plan`-scoped token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitPlanRequest" }
      responses:
        "200":
          description: The existing plan was revised. Body is the week as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeekPlan" }
        "201":
          description: The week's first plan was created. Body is the week as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeekPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            A planning conversation for this week is in progress in the app. Ask the user to
            finish or abandon it, then submit again.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/external/v1/events/{eventId}/cancel:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [plans]
      summary: Cancel a one-off event
      description: |
        Cancels a one-off event before it starts and sends a calendar cancellation. Cancelling an
        already-cancelled event succeeds. Requires a `plan`-scoped token.
      responses:
        "204": { description: Cancelled. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No such event among the user's events., content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: The event has already started., content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer blf_...`. Tokens are created in the app under
        Settings -> Integrations and shown exactly once. A read-scoped token may call GET
        endpoints only; task changes need a write- or plan-scoped token, and plan changes a
        plan-scoped one.

  responses:
    BadRequest:
      description: |
        Malformed input — unparseable JSON, a missing required field, a value outside the
        allowed set, or a path/query id that isn't a UUID. `detail` names the offending
        field and, where relevant, its allowed values.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, unknown, revoked or expired token.
    Forbidden:
      description: |
        The token's scope does not permit this operation (`detail` names the scope that would),
        or the task belongs to a board the caller is not a member of.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such task on any of the caller's boards.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: Well-formed but not actionable — e.g. a category that isn't on the target board.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 7807 problem detail.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: Human- and model-readable explanation. }

    Me:
      type: object
      required: [userId, timeZone, preferredLanguage, tokenScope]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: [string, "null"] }
        timeZone:
          type: string
          description: IANA zone, e.g. `Europe/Berlin`. Resolve relative dates against this.
        preferredLanguage: { type: string }
        defaultBoardId:
          type: [string, "null"]
          format: uuid
          description: The board write calls target when none is named.
        tokenScope:
          type: string
          enum: [read, write, plan]
          description: What this token may do; each scope includes the previous. Check before attempting a write.

    Board:
      type: object
      required: [id, name, role, isDefault]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [owner, member] }
        isDefault:
          type: boolean
          description: True for the board that write calls target when none is named.

    Category:
      type: object
      required: [id, boardId, label, colorId]
      properties:
        id: { type: string, format: uuid }
        boardId: { type: string, format: uuid }
        label: { type: string }
        colorId: { type: string }

    Tag:
      type: object
      required: [id, label, colorId]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        colorId: { type: string }

    Task:
      type: object
      required: [id, boardId, boardName, title, status, categoryId, categoryLabel, tags, hiddenFromAssistant, createdAt]
      properties:
        id: { type: string, format: uuid }
        boardId: { type: string, format: uuid }
        boardName: { type: string }
        title: { type: string, maxLength: 500 }
        description: { type: [string, "null"], maxLength: 5000 }
        url: { type: [string, "null"], maxLength: 2000 }
        priority: { type: [string, "null"], enum: [low, medium, high, null] }
        deadline: { type: [string, "null"], description: "YYYY-MM-DD" }
        estimatedMinutes: { type: [integer, "null"] }
        status: { type: string, enum: [todo, done, archived] }
        categoryId: { type: string, format: uuid }
        categoryLabel: { type: string }
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
        assigneeUserId: { type: [string, "null"], format: uuid }
        relevantFrom:
          type: [string, "null"]
          description: "YYYY-MM-DD. A task dated in the future is hidden from the todo list until then."
        hiddenFromAssistant:
          type: boolean
          description: When true the task is excluded from every AI read path, this API included.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }

    TaskList:
      type: object
      required: [tasks, count, truncated]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        count: { type: integer, description: Number of tasks in this page. }
        truncated:
          type: boolean
          description: True when results were cut off by `limit` — narrow the query or page with `offset`.

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 500 }
        boardId:
          type: string
          format: uuid
          description: Defaults to the caller's default board.
        categoryId:
          type: string
          format: uuid
          description: Must belong to the target board. Defaults to that board's first category.
        description: { type: string, maxLength: 5000 }
        url: { type: string, maxLength: 2000 }
        priority: { type: string, enum: [low, medium, high] }
        deadline: { type: string, description: "YYYY-MM-DD" }
        estimatedMinutes: { type: integer }
        tags:
          type: array
          items: { type: string }
          description: |
            Plain labels. An existing tag is matched case-insensitively; an unknown one is
            created with an auto-assigned color.
        relevantFrom: { type: string, description: "YYYY-MM-DD" }
        hiddenFromAssistant: { type: boolean, default: false }

    UpdateTaskRequest:
      type: object
      description: |
        Every field is optional. An omitted or null field is left unchanged — this is a partial
        update, not a replace. To unset a field, name it in `clear`.
      properties:
        title: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 5000 }
        url: { type: string, maxLength: 2000 }
        priority: { type: string, enum: [low, medium, high] }
        deadline: { type: string, description: "YYYY-MM-DD" }
        estimatedMinutes: { type: integer }
        status:
          type: string
          enum: [todo, done, archived]
          description: Prefer POST /complete and POST /archive over writing this directly.
        categoryId: { type: string, format: uuid }
        tags:
          type: array
          items: { type: string }
          description: Replaces the task's tags entirely. Omit to leave them alone.
        relevantFrom: { type: string, description: "YYYY-MM-DD" }
        hiddenFromAssistant: { type: boolean }
        clear:
          type: array
          items:
            type: string
            enum: [description, url, priority, deadline, estimatedMinutes, relevantFrom, tags]
          description: 'Fields to unset, e.g. {"clear": ["deadline"]}.'

    WeekPlan:
      type: object
      required: [weekStart, weekEnd, timeZone, calendarDelivery, events]
      properties:
        weekStart: { type: string, description: "YYYY-MM-DD, the week's first day." }
        weekEnd: { type: string, description: "YYYY-MM-DD, the week's last day (inclusive)." }
        timeZone: { type: string, description: The user's IANA zone. Write slots in it. }
        calendarDelivery:
          type: string
          enum: [email, feed, none]
          description: |
            Where plan changes go: `email` (calendar invitations), `feed` (the user's calendar
            subscription) or `none` (the plan stays in the app). Tell the user when it's `none`.
        plan:
          oneOf:
            - { $ref: "#/components/schemas/Plan" }
            - { type: "null" }
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }

    Plan:
      type: object
      required: [id, revisionNotes, tasks, hiddenTasksOmitted]
      properties:
        id: { type: string, format: uuid }
        finalizedAt: { type: [string, "null"], format: date-time }
        weekNote: { type: [string, "null"], description: Context about the week written when it was first planned. }
        revisionNotes:
          type: array
          items:
            type: object
            required: [at, text]
            properties:
              at: { type: string, format: date-time }
              text: { type: string }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/PlanTask" }
        hiddenTasksOmitted:
          type: integer
          description: Planned tasks left out because the user hid them from the assistant. A submit keeps them.

    PlanTask:
      type: object
      required: [task, slots]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        slots:
          type: array
          items: { $ref: "#/components/schemas/Slot" }
        notes: { type: [string, "null"] }

    Slot:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date-time, description: "ISO-8601 with an offset, e.g. 2026-11-17T09:00+02:00." }
        end: { type: string, format: date-time }
        label: { type: [string, "null"], maxLength: 200 }

    Event:
      type: object
      required: [id, title, start, end]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        location: { type: [string, "null"] }
        notes: { type: [string, "null"] }

    SubmitPlanRequest:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          maxItems: 100
          description: The whole plan. Each task once, with all of its slots.
          items:
            type: object
            required: [taskId, slots]
            properties:
              taskId: { type: string, format: uuid }
              slots:
                type: array
                minItems: 1
                maxItems: 21
                description: Each starts inside the week, ends after it starts, and lasts at most 24 hours.
                items: { $ref: "#/components/schemas/Slot" }
              notes: { type: string, maxLength: 1000, description: "Replaces the task's plan notes; omit to clear them." }
        note:
          type: string
          maxLength: 2000
          description: |
            What you learned about this week that the schedule can't show (capacity, why
            something was deferred). Stored as the week note on a week's first plan; appended as a
            revision note on later submits.
