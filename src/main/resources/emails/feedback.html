<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="UTF-8"></head>
<body style="font-family: sans-serif; color: #1a1a1a; max-width: 600px; margin: 0 auto; padding: 24px;">
  <h2 style="margin-top: 0;">New feedback</h2>
  <div style="white-space: pre-wrap; background: #f6f6f6; border-radius: 6px; padding: 16px; font-size: 0.95em;">{{feedback_message}}</div>
  <hr style="border: none; border-top: 1px solid #e0e0e0; margin: 24px 0;">
  <p style="font-size: 0.85em; color: #666; margin: 4px 0;">
    Reply to:
    {{#if reply_email}}<a href="mailto:{{reply_email}}">{{reply_email}}</a>{{else}}<em>not provided</em>{{/if}}
  </p>
  <p style="font-size: 0.85em; color: #666; margin: 4px 0;">User: {{user_id}}</p>
  <p style="font-size: 0.85em; color: #666; margin: 4px 0;">Submitted: {{submitted_at}}</p>
</body>
</html>
