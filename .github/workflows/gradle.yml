# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  frontend:

    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    defaults:
      run:
        working-directory: tasker-frontend

    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: tasker-frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Test
      run: npm run test

    - name: Build
      run: npm run build

  build:

    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # The deployed JAR serves the SPA from its own static/, so this job builds the frontend too
    # — `frontend/dist` is gitignored, and a JAR assembled without it is a backend that answers
    # every page with a 404 while every check on the run stays green.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: tasker-frontend/package-lock.json

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

    - name: Build with Gradle Wrapper
      run: ./gradlew release

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: success() || failure()
      with:
        name: test-reports
        path: |
          build/reports/tests/test
          build/reports/kover/html
        retention-days: 3

    # Only needed to ship the release; skipped entirely on PR builds.
    - name: Upload JAR for deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: jar
        path: build/libs/Taskboard-*-SNAPSHOT.jar
        retention-days: 1

  deploy:

    name: Deploy tasks
    needs: [ frontend, build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: Itaypk/itayp-dev/.github/workflows/deploy-service.yml@main
    with:
      service: tasks
      artifact: jar
      jar-glob: 'Taskboard-*-SNAPSHOT.jar'
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

  dependency-submission:

    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
