# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  pull_request:
    branches: [ "main" ]
    # Push (main) is deliberately left unfiltered: it drives deploy, which must always get a
    # fresh jar. Only PR runs are trimmed down to the areas they actually touch.
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "tasker-frontend/**"
      - ".github/workflows/gradle.yml"
  push:
    branches: [ "main" ]

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/gradle.yml'
            frontend:
              - 'tasker-frontend/**'
              - '.github/workflows/gradle.yml'

  frontend:
    needs: changes
    # On push to main this always runs (deploy needs a jar that bundles the current frontend);
    # on PRs it only runs when frontend-relevant paths changed.
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'push' }}

    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    defaults:
      run:
        working-directory: tasker-frontend

    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: tasker-frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Test
      run: npm run test

    - name: Build
      run: npm run build

  build:
    needs: changes
    # Gradle's `release` task bundles the frontend into the jar too, so it must also run when
    # only frontend paths changed. Always runs on push to main so deploy always gets a fresh jar.
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name == 'push' }}

    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # The deployed JAR serves the SPA from its own static/, so this job builds the frontend too
    # — `frontend/dist` is gitignored, and a JAR assembled without it is a backend that answers
    # every page with a 404 while every check on the run stays green.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: tasker-frontend/package-lock.json

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

    - name: Build with Gradle Wrapper
      run: ./gradlew release

    # The reports are a debugging aid, not a verdict: the verdict is the Gradle step above. A
    # storage-quota rejection here was failing builds whose compilation and entire test suite had
    # already passed, so an upload problem must never decide whether this job is green.
    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: success() || failure()
      continue-on-error: true
      with:
        name: test-reports
        path: |
          build/reports/tests/test
          build/reports/kover/html
        retention-days: 3

    # Only needed to ship the release; skipped entirely on PR builds.
    - name: Upload JAR for deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: jar
        path: build/libs/Taskboard-*-SNAPSHOT.jar
        retention-days: 1

  deploy:

    name: Deploy tasks
    needs: [ frontend, build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: Itaypk/itayp-dev/.github/workflows/deploy-service.yml@main
    with:
      service: tasks
      artifact: jar
      jar-glob: 'Taskboard-*-SNAPSHOT.jar'
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

  dependency-submission:
    needs: changes
    # No deploy dependency here, so this can skip whenever dependency-relevant files didn't change,
    # on both PR and push runs — the submitted graph would be identical to the last one anyway.
    if: needs.changes.outputs.backend == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    # `generate-and-submit` rather than the default `generate-submit-and-upload`: submitting the
    # snapshot is what enables Dependabot Alerts, and that half already succeeds on its own. The
    # extra workflow-artifact copy is only a debugging aid, yet it uploaded on every run under the
    # repository's default retention (the action's `artifact-retention-days` is unset), making it a
    # steady drain on the account's artifact storage — and its rejection was the sole reason this
    # job reported failure. Restore the default if the graph artifact is ever needed to debug.
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      with:
        dependency-graph: generate-and-submit
