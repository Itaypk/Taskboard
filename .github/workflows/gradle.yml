# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  pull_request:
    branches: [ "main" ]
    paths: &watched-paths
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "tasker-frontend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/gradle.yml"
  push:
    branches: [ "main" ]
    # Same filter as the PR trigger: a push to main that touches none of these (e.g. a
    # docs-only merge) needs no fresh jar, so skip the workflow — and deploy with it —
    # entirely rather than only gating jobs downstream.
    paths: *watched-paths

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # dorny/paths-filter resolves a PR's changed files through the pulls API, not git, and an
      # explicit `permissions:` block zeroes every scope it doesn't name. Without this the step
      # 403s ("Resource not accessible by integration"), which skips every downstream job — the
      # observed symptom on both Dependabot PRs, the only PRs to have run since path filtering
      # landed.
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/gradle.yml'
            frontend:
              - 'tasker-frontend/**'
              - '.github/workflows/gradle.yml'

  frontend:
    needs: changes
    # On push to main this always runs (deploy needs a jar that bundles the current frontend);
    # on PRs it only runs when frontend-relevant paths changed.
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'push' }}

    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    defaults:
      run:
        working-directory: tasker-frontend

    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: tasker-frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Test
      run: npm run test

    - name: Build
      run: npm run build

  build:
    needs: changes
    # Gradle's `release` task bundles the frontend into the jar too, so it must also run when
    # only frontend paths changed. Always runs on push to main so deploy always gets a fresh jar.
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name == 'push' }}

    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'

    # The deployed JAR serves the SPA from its own static/, so this job builds the frontend too
    # — `frontend/dist` is gitignored, and a JAR assembled without it is a backend that answers
    # every page with a 404 while every check on the run stays green.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: tasker-frontend/package-lock.json

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    - name: Build with Gradle Wrapper
      run: ./gradlew release

    # The reports are a debugging aid, not a verdict: the verdict is the Gradle step above. A
    # storage-quota rejection here was failing builds whose compilation and entire test suite had
    # already passed, so an upload problem must never decide whether this job is green.
    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: success() || failure()
      continue-on-error: true
      with:
        name: test-reports
        path: |
          build/reports/tests/test
          build/reports/kover/html
        retention-days: 3

    # The image is only published from main (release job), so a broken Dockerfile would otherwise
    # surface after merge. Building it here is cheap: it only copies the JAR into a JRE base.
    - name: Verify the container image builds
      run: docker build --tag taskboard:ci .

    # Only needed to publish the release; skipped entirely on PR builds.
    - name: Upload JAR for release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v7
      with:
        name: jar
        path: build/libs/Taskboard-*-SNAPSHOT.jar
        retention-days: 1

  # Publishes the verified JAR as a GitHub Release. This repo does not deploy: a public repo can't
  # call the reusable deploy workflow in the private ops repo (Itaypk/itayp-dev), so production is
  # deployed from there by hand ("Deploy release" workflow), which pulls this release's JAR. That
  # also keeps the deploy SSH key out of this repo entirely.
  release:
    name: Publish release
    needs: [ frontend, build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Push the container image to GHCR (ghcr.io/<owner>/<repo>) for self-hosters.
      packages: write

    steps:
    # The Dockerfile; the JAR itself comes from the build job's artifact.
    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        name: jar
        path: jar

    # The ops repo's deploy refuses anything but exactly one matching asset (a Spring build's
    # -plain.jar has no Main-Class), so refuse to publish an ambiguous release in the first place.
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: build-${{ github.run_number }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        jars=(jar/Taskboard-*-SNAPSHOT.jar)
        if [ "${#jars[@]}" -ne 1 ]; then
          echo "::error::expected exactly 1 JAR, got ${#jars[@]}: ${jars[*]:-<none>}"
          exit 1
        fi
        gh release create "$TAG" "${jars[0]}" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "$TAG (${GITHUB_SHA::7})" \
          --generate-notes

    # The same JAR as the release, as a container image for self-hosting (docs/SELF-HOSTING.md).
    # Tagged with the release tag and `latest`; image names must be lowercase.
    - name: Image name
      run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        build-args: JAR_FILE=jar/Taskboard-*-SNAPSHOT.jar
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.IMAGE }}:build-${{ github.run_number }}
          ${{ env.IMAGE }}:latest
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=build-${{ github.run_number }}
          org.opencontainers.image.licenses=AGPL-3.0-only

  dependency-submission:
    needs: changes
    # Push-only, and skipped when no dependency-relevant file changed. Dependabot alerts are
    # computed from the default branch's graph, so a snapshot taken on a PR branch was never
    # doing anything — and it actively broke Dependabot's own PRs, whose GITHUB_TOKEN is capped
    # read-only no matter what `permissions:` below asks for, so the submit 403s.
    if: needs.changes.outputs.backend == 'true' && github.event_name == 'push'

    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    # `generate-and-submit` rather than the default `generate-submit-and-upload`: submitting the
    # snapshot is what enables Dependabot Alerts, and that half already succeeds on its own. The
    # extra workflow-artifact copy is only a debugging aid, yet it uploaded on every run under the
    # repository's default retention (the action's `artifact-retention-days` is unset), making it a
    # steady drain on the account's artifact storage — and its rejection was the sole reason this
    # job reported failure. Restore the default if the graph artifact is ever needed to debug.
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        dependency-graph: generate-and-submit
