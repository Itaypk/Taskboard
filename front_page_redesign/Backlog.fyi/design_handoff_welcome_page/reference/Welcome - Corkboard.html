<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="welcome-corkboard.jsx"></script>

<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(<WelcomeCorkboard />);

  // Scale the fixed 1320x860 stage to fit any viewport (letterboxed, never cropped).
  function fitStage() {
    const stage = document.getElementById('cork-stage');
    if (!stage) { requestAnimationFrame(fitStage); return; }
    const W = 1320, H = 860;
    const pad = 32;
    const s = Math.min((window.innerWidth - pad) / W, (window.innerHeight - pad) / H, 1);
    stage.style.transform = `scale(${s})`;
  }
  window.addEventListener('resize', fitStage);
  // run after React mounts the stage
  const obs = new MutationObserver(fitStage);
  obs.observe(document.getElementById('root'), { childList: true, subtree: true });
  fitStage();
</script>

</body>
